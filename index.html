<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#5c94fc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Jump Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root { --btn-bg: rgba(255,255,255,.18); --btn-border: rgba(255,255,255,.55); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    image-rendering: pixelated; image-rendering: crisp-edges; outline: none; }
  #touch { position: fixed; left: 0; right: 0; bottom: 0; display: none; justify-content: space-between;
    align-items: flex-end; padding: 0 max(18px, env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    pointer-events: none; }
  #touch.on { display: flex; }
  .pad { display: flex; gap: 14px; }
  .tb { pointer-events: auto; width: 76px; height: 76px; border-radius: 50%; background: var(--btn-bg);
    border: 3px solid var(--btn-border); color: #fff; font: 18px 'Press Start 2P', monospace;
    display: flex; align-items: center; justify-content: center; padding: 0; touch-action: none;
    -webkit-tap-highlight-color: transparent; }
  .tb.down { background: rgba(255,255,255,.45); }
  .tb.j { width: 92px; height: 92px; background: rgba(230,60,40,.45); }
  .tb.j.down { background: rgba(255,90,60,.75); }
  .tb.pp { background: rgba(250,190,40,.4); }
  .tb.pp.down { background: rgba(255,210,60,.75); }
  .tb svg { width: 30px; height: 30px; fill: #fff; }
  .pad.act { gap: 10px; align-items: flex-end; }
  /* left pad: left/right on top, down centred underneath */
  .pad.dpad { display: grid; grid-template-columns: 64px 64px; grid-template-areas: "l r" "d d"; gap: 8px 14px; }
  .pad.dpad .tb { width: 64px; height: 64px; }
  .pad.dpad [data-k=ArrowLeft] { grid-area: l; }
  .pad.dpad [data-k=ArrowRight] { grid-area: r; }
  .pad.dpad [data-k=ArrowDown] { grid-area: d; justify-self: center; }
  .pad.act .tb { width: 50px; height: 50px; font-size: 13px; border-width: 2px; }
  .pad.act .tb.j { width: 56px; height: 56px; }
  .tb.xx { background: rgba(160,80,240,.5); display: none; }
  .tb.xx.show { display: flex; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="touch">
  <div class="pad dpad">
    <button class="tb" data-k="ArrowLeft" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M16 3 5 12l11 9z"/></svg></button>
    <button class="tb" data-k="ArrowDown" aria-label="Down (enter pipe)"><svg viewBox="0 0 24 24"><path d="M3 8h18l-9 11z"/></svg></button>
    <button class="tb" data-k="ArrowRight" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8 3l11 9-11 9z"/></svg></button>
  </div>
  <div class="pad act">
    <button class="tb xx" data-k="KeyX" aria-label="Come back home">X</button>
    <button class="tb pp" data-k="KeyP" aria-label="Punch">P</button>
    <button class="tb j" data-k="KeyJ" aria-label="Jump">J</button>
  </div>
</div>
<script>
'use strict';
// ============================================================================
// Constants
// ============================================================================
const TS = 16, LH = 15, LW = 212, VH = 240;
const VERSION = 'V2.6';                 // shown on the title screen; bump on each release
const STEP = 1 / 120;                    // fixed physics step (render is interpolated)
const GRAV = 1500, JUMP_V = 470, STOMP_V = 330, MAX_FALL = 520;
const ACC = 700, DEC = 900, AIR_DEC = 400, MAX_VX = 140;
const FLAGX = 202, CASTLE_X = 205, CHECKPOINT_X = 100;
const WARP_TIME = .55;                   // seconds to sink into / rise out of a pipe
// each other player online gets their own warp pipe in one of these colours
const PLAYER_COLORS = ['#e83a3a', '#3a7ae8', '#f0c020', '#a04ae8', '#f07a1a', '#20c8d8', '#e84ab0', '#e8e8e8'];
const SOLID_FROM = 1;                    // any tile id >= 1 is solid
// Tile ids
const GROUND = 1, BRICK = 2, QBLOCK = 3, USED = 4, CRATE = 5, HARD = 6,
      PIPE_TL = 7, PIPE_TR = 8, PIPE_BL = 9, PIPE_BR = 10;

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let VW = 320;

// ============================================================================
// Sprite helpers (everything is pre-rendered once to offscreen canvases)
// ============================================================================
function cv(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function paint(w, h, fn) { const c = cv(w, h); const g = c.getContext('2d'); fn(g); return c; }
function px(g, col, x, y, w = 1, h = 1) { g.fillStyle = col; g.fillRect(x, y, w, h); }
function fromRows(rows, pal) {
  return paint(rows[0].length, rows.length, g => {
    rows.forEach((r, y) => { for (let x = 0; x < r.length; x++) if (pal[r[x]]) px(g, pal[r[x]], x, y); });
  });
}
function mirror(c) {
  return paint(c.width, c.height, g => { g.translate(c.width, 0); g.scale(-1, 1); g.drawImage(c, 0, 0); });
}
function pair(c) { return { r: c, l: mirror(c) }; }
// Rasterise a union of circles into a pixel-art blob with outline/highlight.
function blob(w, h, circles, colorFn) {
  const ins = (x, y) => x >= 0 && y >= 0 && x < w && y < h &&
    circles.some(([cx, cy, r]) => (x + .5 - cx) ** 2 + (y + .5 - cy) ** 2 <= r * r);
  return paint(w, h, g => {
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (!ins(x, y)) continue;
      const edge = !ins(x - 1, y) || !ins(x + 1, y) || !ins(x, y - 1) || (y + 1 < h && !ins(x, y + 1));
      px(g, colorFn(x, y, edge, ins), x, y);
    }
  });
}

// ---------------------------------------------------------------- hero "Pip"
const HERO_PAL = { C: '#18a8a8', c: '#0b6c74', H: '#5a2c10', S: '#ffc894', s: '#e0905a', K: '#1a1020',
  T: '#ff7a1a', t: '#c44a0a', Y: '#ffe14a', P: '#2a3a8a', O: '#6a3410' };
const HEAD = [
  '................',
  '.....CCCCCC.....',
  '....CCCCCCCCC...',
  '....cccCCCCCCCC.',
  '....HHSSSKSS....',
  '...HHSSSSKSSS...',
  '...HSsSSSSSSSS..',
  '....SSSSSKKKK...',
  '.....SSSSSSS....',
];
const makeHero = pal => ({
  idle: pair(fromRows([...HEAD,
    '....TTTTYTTT....',
    '...TTTTTTTTTT...',
    '..SSTtTTTTtTSS..',
    '..SS.tTTTTt.SS..',
    '....PPP..PPP....',
    '...OOOO..OOOO...',
    '...OOOO..OOOO...'], pal)),
  walk1: pair(fromRows([...HEAD,
    '....TTTTYTTT....',
    '..STTTTTTTTT....',
    '..SSTtTTTTtTS...',
    '....tTTTTTtSS...',
    '...PPPP..PPP....',
    '..OOOO....OOOO..',
    '.OOOO......OOO..'], pal)),
  walk2: pair(fromRows([...HEAD,
    '....TTTTYTTT....',
    '...TTTTTTTTT....',
    '...STtTTTtTS....',
    '...SStTTTTSS....',
    '.....PPPPP......',
    '.....OOOOO......',
    '....OOOOOO......'], pal)),
  punch: pair(fromRows([...HEAD,
    '....TTTTYTTT....',
    '...TTTTTTTTTSSSS',
    '..SSTtTTTTtTTSSS',
    '..SS.tTTTTt.....',
    '....PPP..PPP....',
    '...OOOO..OOOO...',
    '...OOOO..OOOO...'], pal)),
  jump: pair(fromRows([...HEAD,
    '..S.TTTTYTTT.S..',
    '..STTTTTTTTTTS..',
    '...TtTTTTTTtT...',
    '....tTTTTTTt....',
    '...PPP...PPP....',
    '..OOO.....OOO...',
    '..OO.......OO...'], pal)),
});
const HERO = makeHero(HERO_PAL);
// visiting players from another screen get a pink cap + blue hoodie
const heroCache = new Map();
// a visiting player wears their warp-pipe colour
function heroFor(color) {
  if (!heroCache.has(color)) heroCache.set(color, makeHero({ ...HERO_PAL, C: color, c: mix(color, '#000000', .45),
    T: mix(color, '#ffffff', .25), t: mix(color, '#000000', .25), Y: '#ffffff' }));
  return heroCache.get(color);
}

// ---------------------------------------------------------------- enemy "Blorb"
const EN_PAL = { P: '#8a3ab8', L: '#c98af0', D: '#4a1a6a', K: '#1a0a20', W: '#ffffff', F: '#3a1a10' };
const EN_BODY = [
  '................',
  '......PPPP......',
  '....PPLLPPPP....',
  '...PLLPPPPPPP...',
  '..PLPKPPPPKPPP..',
  '..PPPPKPPKPPPP..',
  '.PPPWWKPPKWWPPP.',
  '.PPPWKKPPKKWPPP.',
  '.PPPWKKPPKKWPPP.',
  '.PPPPPPPPPPPPPP.',
  '.PPPPPKKKKPPPPP.',
  '..PPPPPPPPPPPP..',
  '...DDDDDDDDDD...',
];
const ENEMY = [
  fromRows([...EN_BODY, '...FFF....FFF...', '..FFFF....FFFF..', '..FFFFF..FFFFF..'], EN_PAL),
  fromRows([...EN_BODY, '..FFF......FFF..', '.FFFF......FFFF.', '.FFFFF....FFFFF.'], EN_PAL),
];

// ---------------------------------------------------------------- tiles
const dirtSpots = [[2, 8], [9, 4], [12, 11], [5, 13], [13, 6], [7, 10], [1, 3], [10, 14]];
function dirt(g) {
  px(g, '#c86a2c', 0, 0, 16, 16);
  for (const [x, y] of dirtSpots) { px(g, '#8e4218', x, y, 2, 1); px(g, '#eea06a', x, y - 1); }
  px(g, '#9a4c1e', 0, 15, 16, 1); px(g, '#9a4c1e', 15, 0, 1, 16);
}
const TILE = {};
TILE.ground = paint(16, 16, dirt);
TILE.groundTop = paint(16, 16, g => {
  dirt(g);
  const fringe = [5, 4, 5, 6, 5, 4, 4, 5, 6, 5, 4, 5, 6, 5, 4, 5];
  for (let x = 0; x < 16; x++) { px(g, '#3cbc3c', x, 0, 1, fringe[x]); px(g, '#1e7a24', x, fringe[x]); }
  px(g, '#9af07a', 0, 0, 16, 1); px(g, '#62d84c', 0, 1, 16, 1);
  px(g, '#c8ffa0', 3, 1); px(g, '#c8ffa0', 11, 1);
});
TILE.brick = paint(16, 16, g => {
  px(g, '#c8501c', 0, 0, 16, 16);
  for (let r = 0; r < 4; r++) {
    const y = r * 4, off = r % 2 ? 4 : 0;
    px(g, '#3a1404', 0, y + 3, 16, 1);
    for (let x = off; x < 16; x += 8) { px(g, '#3a1404', x, y, 1, 3); px(g, '#f09060', x + 1, y, 6, 1); }
    if (off) { px(g, '#f09060', 0, y, 3, 1); }
  }
});
function qBlock(face, glyph) {
  return paint(16, 16, g => {
    px(g, '#5a2800', 0, 0, 16, 16);
    px(g, face, 1, 1, 14, 14);
    px(g, '#fff0b0', 1, 1, 14, 1); px(g, '#fff0b0', 1, 1, 1, 14);
    px(g, '#b05a00', 1, 14, 14, 1); px(g, '#b05a00', 14, 1, 1, 14);
    for (const [x, y] of [[3, 3], [12, 3], [3, 12], [12, 12]]) px(g, '#7a3a00', x, y);
    if (!glyph) return;
    const q = ['.XXXX.', 'XX..XX', '....XX', '...XX.', '..XX..', '......', '..XX..'];
    q.forEach((row, y) => { for (let x = 0; x < 6; x++) if (row[x] === 'X') { px(g, '#7a3a00', 6 + x, 5 + y); px(g, '#fff6d8', 5 + x, 4 + y); } });
  });
}
TILE.q = [qBlock('#f8b800', true), qBlock('#e89800', true), qBlock('#c87800', true)];
TILE.used = qBlock('#9a5420', false);
TILE.crate = paint(16, 16, g => {
  px(g, '#3e2210', 0, 0, 16, 16);
  px(g, '#d8984e', 1, 1, 14, 14);
  px(g, '#f0c080', 1, 1, 14, 1); px(g, '#f0c080', 1, 1, 1, 14);
  px(g, '#9a6028', 1, 14, 14, 1); px(g, '#9a6028', 14, 1, 1, 14);
  px(g, '#b4743a', 3, 3, 10, 10);
  px(g, '#8a5424', 3, 6, 10, 1); px(g, '#8a5424', 3, 9, 10, 1);
  for (let i = 0; i < 9; i++) { px(g, '#7a4418', 3 + i, 3 + i, 2, 1); px(g, '#d8984e', 4 + i, 3 + i); }
  for (const [x, y] of [[2, 2], [13, 2], [2, 13], [13, 13]]) px(g, '#3e2210', x, y);
});
TILE.hard = paint(16, 16, g => {
  px(g, '#4a4a5a', 0, 0, 16, 16);
  px(g, '#a8a8bc', 0, 0, 15, 15);
  px(g, '#e4e4f0', 0, 0, 15, 1); px(g, '#e4e4f0', 0, 0, 1, 15);
  px(g, '#787890', 1, 14, 14, 1); px(g, '#787890', 14, 1, 1, 14);
  px(g, '#bcbcce', 3, 3, 9, 9); px(g, '#8c8ca0', 4, 12, 9, 1); px(g, '#8c8ca0', 12, 4, 1, 9);
});
// blend two #rrggbb colours (t = 0 -> a, 1 -> b)
function mix(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ch = sh => Math.round(((pa >> sh) & 255) * (1 - t) + ((pb >> sh) & 255) * t);
  return '#' + ((ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).padStart(6, '0');
}
const GREEN_PIPE = { out: '#0a3a0a', light: '#5ac83a', hi: '#c8ff98', mid: '#2ea42e', dark: '#1e7a1e', darker: '#145a14', lipHi: '#9af070' };
const pipePal = base => ({ out: mix(base, '#000000', .78), light: mix(base, '#ffffff', .3), hi: mix(base, '#ffffff', .7), mid: base,
                           dark: mix(base, '#000000', .3), darker: mix(base, '#000000', .5), lipHi: mix(base, '#ffffff', .5) });
function pipeSprite(lip, pal = GREEN_PIPE) {
  return paint(32, 16, g => {
    const W = lip ? 32 : 28, ox = lip ? 0 : 2;
    for (let x = 0; x < W; x++) {
      let c;
      if (x === 0 || x === W - 1) c = pal.out;
      else if (x <= 2) c = pal.light;
      else if (x <= 5) c = pal.hi;
      else if (x <= 9) c = pal.light;
      else if (x < W - 9) c = pal.mid;
      else if (x < W - 5) c = pal.dark;
      else c = pal.darker;
      px(g, c, ox + x, 0, 1, 16);
    }
    if (lip) { px(g, pal.out, 0, 0, 32, 1); px(g, pal.out, 0, 15, 32, 1); px(g, pal.lipHi, 1, 1, 30, 1); }
  });
}
TILE.pipeLip = pipeSprite(true);
TILE.pipeBody = pipeSprite(false);
const pipeCache = new Map();
function pipeFor(color) {
  if (!pipeCache.has(color)) pipeCache.set(color, { lip: pipeSprite(true, pipePal(color)), body: pipeSprite(false, pipePal(color)) });
  return pipeCache.get(color);
}

function coinFrame(rx) {
  const ry = 7;
  return paint(16, 16, g => {
    const ins = (x, y) => ((x + .5 - 8) / rx) ** 2 + ((y + .5 - 8) / ry) ** 2 <= 1;
    for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {
      if (!ins(x, y)) continue;
      const edge = !ins(x - 1, y) || !ins(x + 1, y) || !ins(x, y - 1) || !ins(x, y + 1);
      let c = '#f8c820';
      if (edge) c = '#7a4a00';
      else if (rx > 2 && !ins(x - 2, y - 1)) c = '#fff6b0';
      else if (rx > 4 && Math.abs(x + .5 - 8.5) < 1 && Math.abs(y + .5 - 8) < 4) c = '#d89a00';
      px(g, c, x, y);
    }
  });
}
const COIN = [coinFrame(5.6), coinFrame(3.6), coinFrame(1.3), coinFrame(3.6)];

const FLAG = paint(16, 15, g => {
  for (let y = 0; y < 15; y++) {
    const w = Math.round(16 * (1 - Math.abs(y - 7) / 7.5));
    px(g, '#22c04a', 16 - w, y, w, 1); px(g, '#0e7a2a', 16 - w, y);
  }
  for (const [x, y] of [[10, 5], [9, 6], [10, 6], [11, 6], [8, 7], [9, 7], [10, 7], [11, 7], [12, 7], [9, 8], [10, 8], [11, 8], [10, 9]]) px(g, '#ffffff', x, y);
});

// ---------------------------------------------------------------- warp swirl (shown while warping)
const PORTAL = [0, 1, 2, 3, 4, 5].map(f => paint(20, 34, g => {
  const cols = ['#2a0a5a', '#5a1ab8', '#8a4af0', '#c49aff', '#f0e0ff'];
  for (let y = 0; y < 34; y++) for (let x = 0; x < 20; x++) {
    const dx = (x + .5 - 10) / 9.5, dy = (y + .5 - 17) / 16.5, d = Math.hypot(dx, dy);
    if (d > 1) continue;
    if (d > .86) { px(g, '#1a0638', x, y); continue; }
    const band = Math.floor((Math.atan2(dy, dx) / (Math.PI * 2) + 1) * 4 + d * 5 - f * 4 / 6);
    px(g, cols[(band % 4 + 4) % 4 + (d < .28 ? 1 : 0)], x, y);
  }
}));

// ---------------------------------------------------------------- scenery
const CLOUD = blob(56, 28, [[14, 18, 9], [28, 13, 12], [42, 18, 9], [28, 19, 8]],
  (x, y, e, ins) => e ? '#a8d4ff' : !ins(x, y - 2) ? '#ffffff' : y > 20 ? '#dcecff' : '#ffffff');
const hillFn = (x, y, e, ins) => e ? '#0e5a20' : !ins(x - 2, y - 2) ? '#7ad85a' : '#3cb04a';
const HILL = blob(96, 48, [[48, 58, 48]], hillFn);
const HILL_S = blob(64, 32, [[32, 40, 31]], hillFn);
for (const [h, dots] of [[HILL, [[40, 20], [56, 28], [36, 34]]], [HILL_S, [[28, 16], [36, 22]]]]) {
  const g = h.getContext('2d');
  for (const [x, y] of dots) { px(g, '#0e5a20', x, y, 2, 4); px(g, '#0e5a20', x - 1, y + 1, 4, 2); }
}
const FAR_HILLS = blob(320, 72, [[60, 80, 52], [150, 96, 64], [250, 84, 50], [320, 96, 40], [0, 96, 40]],
  (x, y, e) => e ? '#7cbcae' : '#a6dcc8');
const BUSH = blob(48, 18, [[10, 17, 9], [24, 13, 12], [38, 17, 9]],
  (x, y, e, ins) => e ? '#0e5a20' : !ins(x - 1, y - 2) ? '#a6f07a' : '#48c43a');
const CASTLE = paint(80, 96, g => {
  const b = TILE.brick;
  for (let tx = 0; tx < 5; tx++) for (let ty = 3; ty < 6; ty++) g.drawImage(b, tx * 16, ty * 16);
  for (let tx = 1; tx < 4; tx++) for (let ty = 1; ty < 3; ty++) g.drawImage(b, tx * 16, ty * 16);
  for (let i = 0; i < 10; i += 2) g.drawImage(b, 0, 0, 8, 8, i * 8, 40, 8, 8);
  for (let i = 2; i < 8; i += 2) g.drawImage(b, 0, 0, 8, 8, i * 8, 8, 8, 8);
  // door with arch
  px(g, '#000', 32, 70, 16, 26); px(g, '#000', 34, 66, 12, 4); px(g, '#000', 36, 64, 8, 2);
  // windows
  px(g, '#000', 26, 22, 6, 12); px(g, '#000', 48, 22, 6, 12);
});

// ============================================================================
// Audio (tiny WebAudio synth, created on first user gesture)
// ============================================================================
let AC = null, musicOn = true, sfxOn = true;     // music and sound effects mute independently
try { musicOn = localStorage.getItem('jumpgame.music') !== '0'; sfxOn = localStorage.getItem('jumpgame.sfx') !== '0'; } catch (e) {}
function toggleSound(which) {
  if (which === 'music') musicOn = !musicOn; else sfxOn = !sfxOn;
  try { localStorage.setItem('jumpgame.music', musicOn ? '1' : '0'); localStorage.setItem('jumpgame.sfx', sfxOn ? '1' : '0'); } catch (e) {}
  showToast(which === 'music' ? (musicOn ? 'MUSIC ON' : 'MUSIC OFF') : (sfxOn ? 'SOUND FX ON' : 'SOUND FX OFF'), 1.5);
}
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
}
function tone(f0, f1, dur, type = 'square', vol = .07, delay = 0) {
  if (!AC || !sfxOn) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
}
const sfx = {
  jump: () => tone(260, 640, .16),
  djump: () => { tone(420, 1100, .2); tone(840, 1600, .12, 'triangle', .04, .04); },
  coin: () => { tone(988, 0, .07); tone(1319, 0, .3, 'square', .07, .07); },
  stomp: () => tone(480, 90, .13, 'triangle', .18),
  bump: () => tone(160, 70, .09, 'triangle', .2),
  brk: () => { tone(220, 40, .22, 'sawtooth', .07); tone(120, 40, .2, 'triangle', .15); },
  die: () => [523, 494, 466, 440, 392, 330, 262].forEach((f, i) => tone(f, 0, .16, 'square', .07, i * .14)),
  flag: () => tone(200, 1200, .9, 'square', .06),
  clear: () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0, .2, 'square', .07, i * .13)),
  oneup: () => [660, 784, 1319, 1047, 1175, 1568].forEach((f, i) => tone(f, 0, .1, 'square', .06, i * .09)),

// ---------------------------------------------------------------- background music
// Original bouncy chiptune, sequenced in 16th-note steps and scheduled ahead on the
// audio clock (lookahead scheduler) so timing stays rock-solid regardless of frame rate.
const BPM = 150;
const NOTE_IDX = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
const freq = n => 440 * 2 ** ((NOTE_IDX[n[0]] + (n[1] === '#' ? 1 : 0) + 12 * (+n[n.length - 1] + 1) - 69) / 12);
const MELODY = [
  'E5 2 G5 2 C6 2 G5 2 A5 3 G5 1 E5 2 - 2',
  'F5 2 A5 2 G5 2 E5 2 D5 2 E5 2 C5 4',
  'E5 2 G5 2 C6 2 D6 2 E6 3 D6 1 C6 2 A5 2',
  'B5 2 G5 2 A5 2 B5 2 C6 6 - 2',
  'A5 2 A5 1 A5 1 C6 2 A5 2 G5 2 E5 2 G5 4',
  'F5 2 F5 1 F5 1 A5 2 F5 2 E5 2 C5 2 E5 4',
  'D5 2 F5 2 A5 2 C6 2 B5 2 A5 2 G5 2 F5 2',
  'E5 2 D5 2 G5 2 B4 2 C5 6 - 2',
];
const BASS_CHORDS = [['C3', 'G3', 'C4', 'G3'], ['F2', 'C3', 'F3', 'C3'], ['C3', 'G3', 'C4', 'G3'], ['G2', 'D3', 'G3', 'D3'],
                     ['A2', 'E3', 'A3', 'E3'], ['F2', 'C3', 'F3', 'C3'], ['D3', 'A3', 'D4', 'A3'], ['G2', 'D3', 'G3', 'B2']];
const SONG_STEPS = MELODY.length * 16;
const leadAt = new Array(SONG_STEPS).fill(null), bassAt = new Array(SONG_STEPS).fill(null);
{
  let s = 0;
  for (const bar of MELODY) {
    const tok = bar.split(' ');
    for (let i = 0; i < tok.length; i += 2) { if (tok[i] !== '-') leadAt[s] = { f: freq(tok[i]), len: +tok[i + 1] }; s += +tok[i + 1]; }
  }
  BASS_CHORDS.forEach((ch, bar) => { for (let i = 0; i < 8; i++) bassAt[bar * 16 + i * 2] = freq(ch[i % 4]); });
}
const music = { on: false, step: 0, nextT: 0, timer: 0, gain: null, noise: null, speed: 1 };
function voice(f, t, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t);
  g.gain.linearRampToValueAtTime(vol * .6, t + dur * .5);
  g.gain.exponentialRampToValueAtTime(.0001, t + dur * .95);
  o.connect(g).connect(music.gain); o.start(t); o.stop(t + dur);
}
function drum(t, hat) {
  if (!music.noise) {
    const len = AC.sampleRate * .1, buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    music.noise = buf;
  }
  const src = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  src.buffer = music.noise; f.type = hat ? 'highpass' : 'lowpass'; f.frequency.value = hat ? 7000 : 900;
  g.gain.setValueAtTime(hat ? .05 : .18, t); g.gain.exponentialRampToValueAtTime(.0001, t + (hat ? .04 : .09));

}
function scheduleMusic() {
  const stepDur = 60 / BPM / 4 / music.speed;
  while (music.nextT < AC.currentTime + .12) {
    const s = music.step, t = music.nextT;
    const lead = leadAt[s];
    if (lead) { voice(lead.f, t, lead.len * stepDur, 'square', .055); voice(lead.f * 1.003, t, lead.len * stepDur, 'square', .02); }
    if (bassAt[s]) voice(bassAt[s], t, stepDur * 1.8, 'triangle', .22);
    if (s % 8 === 0) drum(t, false);

}
function startMusic() {
  if (!AC || music.on) return;
  if (!music.gain) { music.gain = AC.createGain(); music.gain.connect(AC.destination); }
  music.on = true; music.step = 0; music.nextT = AC.currentTime + .06;
  music.gain.gain.cancelScheduledValues(AC.currentTime);
  music.gain.gain.setValueAtTime(.7, AC.currentTime);

}
function stopMusic() {

function syncMusic() {

  if (want && !music.on) startMusic(); else if (!want && music.on) stopMusic();
  music.speed = time < 100 ? 1.3 : 1;                 // "hurry up!" when time is low
}

let grid, coins, enemies, parts, bumps, decos, clouds, PIPES = [];
let tileLayer, tileLayerCtx;            // cached static tile layer (redrawn per changed tile)

function inGrid(x, y) { return x >= 0 && x < LW && y >= 0 && y < LH; }

function getT(x, y) { return inGrid(x, y) ? grid[y][x] : 0; }

function buildLevel() {
  grid = Array.from({ length: LH }, () => new Uint8Array(LW));
  coins = []; enemies = []; parts = []; bumps = [];
  const G = (a, b) => { for (let x = a; x <= b; x++) { setT(x, 13, GROUND); setT(x, 14, GROUND); } };
  const coin = (tx, ty) => coins.push({ x: tx * TS + 3, y: ty * TS + 1, w: 10, h: 14, got: false });
  const row = (x, y, s) => {
    for (let i = 0; i < s.length; i++) {
      const t = { B: BRICK, '?': QBLOCK, X: CRATE, H: HARD }[s[i]];
      if (t) setT(x + i, y, t); else if (s[i] === 'o') coin(x + i, y);
    }
  };
  const stack = (x, h, t = CRATE) => { for (let i = 0; i < h; i++) setT(x, 12 - i, t); };
  const pipe = (x, h) => {
    const top = 13 - h;
    setT(x, top, PIPE_TL); setT(x + 1, top, PIPE_TR);
    for (let y = top + 1; y <= 12; y++) { setT(x, y, PIPE_BL); setT(x + 1, y, PIPE_BR); }
  };
  const foe = (tx, ty = 12) => enemies.push({ x: tx * TS + 1, y: ty * TS + 2, w: 14, h: 14, vx: -32, vy: 0,
    active: false, dead: false, squash: 0, flipped: false, anim: 0, onGround: false, px: 0, py: 0 });

  // ground with pits
  G(0, 68); G(71, 86); G(90, 150); G(153, LW - 1);

  // --- section 1: intro
  row(10, 9, '?');
  row(15, 9, 'B?B?B'); row(17, 5, '?');
  foe(21);
  // box hopping
  stack(24, 1); stack(25, 2); stack(26, 3); stack(27, 1);
  row(24, 7, 'oooo');
  pipe(31, 2); foe(36); pipe(40, 3); foe(44); foe(46); pipe(49, 4);
  // high crate shelf: needs a double jump from the ground
  row(53, 9, 'XXX'); row(57, 6, 'XXXX'); row(57, 5, 'oooo');
  pipe(63, 2);
  row(67, 8, 'o'); row(68, 7, 'oo'); row(70, 8, 'o');            // arc over pit

  // --- section 2
  row(74, 9, 'B?B'); row(78, 5, 'BBBBBBBB'); row(78, 4, 'o.o.o.o.');
  foe(80, 4); foe(83, 4);
  row(84, 9, '?');
  row(87, 7, 'ooo');                                              // over pit
  row(92, 9, 'BB?B'); row(93, 5, '???');
  foe(97); foe(99);
  row(103, 9, '?'); row(106, 9, '?'); row(106, 5, '?'); row(109, 9, '?');
  foe(111); foe(113);
  // crate tower + floating shelf
  stack(116, 2); stack(117, 4); stack(120, 6); row(120, 6, 'o');
  row(123, 5, 'XXXXX'); row(123, 4, 'ooooo');
  foe(128); foe(130);
  row(134, 9, 'B?BB?B'); row(136, 5, 'BB'); row(136, 4, 'oo');
  pipe(142, 3); foe(146);
  row(149, 8, 'oo'); row(151, 7, 'oo');                           // over pit

  // --- section 3: stairs to the flag
  for (let i = 0; i < 4; i++) stack(156 + i, i + 1, HARD);
  for (let i = 0; i < 4; i++) stack(163 + i, 4 - i, HARD);
  row(160, 4, 'ooo');
  pipe(170, 2); foe(175); foe(177);
  row(179, 9, 'BB?B'); row(180, 5, 'XX'); row(180, 4, 'oo');
  for (let i = 0; i < 8; i++) stack(186 + i, i + 1, HARD);
  stack(194, 8, HARD);
  setT(FLAGX, 12, HARD);
  PIPES = [];
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) if (grid[y][x] === PIPE_TL) PIPES.push({ x, top: y });
  PIPES.sort((a, b) => a.x - b.x);

  // scenery (seeded so it's identical every time)
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const solidSpan = (a, b) => { for (let x = a; x <= b; x++) if (getT(x, 13) !== GROUND || getT(x, 12)) return false; return true; };
  decos = [];
  for (let x = 0; x < LW - 8;) {
    const big = rnd() < .5, w = big ? 6 : 4;

    if (ok) decos.push({ img: big ? HILL : HILL_S, x: x * TS, y: 13 * TS - (big ? 48 : 32) });
    x += 14 + Math.floor(rnd() * 14);

  for (let x = 6; x < LW - 8;) {
    if (solidSpan(x, x + 2)) decos.push({ img: BUSH, x: x * TS, y: 13 * TS - 18 });

}

function tileImage(t, x, y) {
  switch (t) {
    case GROUND: return getT(x, y - 1) === GROUND ? TILE.ground : TILE.groundTop;
    case BRICK: return TILE.brick;
    case USED: return TILE.used;

}
function drawTileInto(g, x, y) {

  if (!t || t === QBLOCK) return;
  if (t >= PIPE_TL) {
    const lip = t === PIPE_TL || t === PIPE_TR, right = t === PIPE_TR || t === PIPE_BR;
    g.drawImage(lip ? TILE.pipeLip : TILE.pipeBody, right ? 16 : 0, 0, 16, 16, x * TS, y * TS, 16, 16);
    return;
  }

function buildTileLayer() {
  tileLayer = cv(LW * TS, LH * TS);
  tileLayerCtx = tileLayer.getContext('2d');
  for (let y = 0; y < LH; y++) for (let x = 0; x < LW; x++) drawTileInto(tileLayerCtx, x, y);
}
function startBump(tx, ty) {

  tileLayerCtx.clearRect(tx * TS, ty * TS, TS, TS);       // drawn with offset until the bump ends
}
function changeTile(x, y, t) {
  grid[y][x] = t;
  drawTileInto(tileLayerCtx, x, y);
  if (y + 1 < LH) drawTileInto(tileLayerCtx, x, y + 1);   // grass edge may change

let state = 'title', stateT = 0, pausedFrom = null;
let score = 0, coinCount = 0, lives = 3, time = 300, checkpoint = false, hiScore = 0;

try { hiScore = +localStorage.getItem('jumpgame.hi') || 0; } catch (e) {}

function resetPlayer() {
  const sx = checkpoint ? CHECKPOINT_X * TS : 3 * TS;
  p = { x: sx, y: 12 * TS, w: 12, h: 16, vx: 0, vy: 0, px: sx, py: 12 * TS, onGround: false, face: 1,

}

  else if (state === 'paused') { state = pausedFrom; sfx.pause(); }
}
function addScore(n, x, y) { score += n; if (x !== undefined) parts.push({ type: 'text', s: '' + n, x, y, vy: -40, life: .8 }); }

// Physics
// ============================================================================
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function solid(tx, ty) { if (tx < 0 || tx >= LW) return true; if (ty < 0 || ty >= LH) return false; return grid[ty][tx] >= SOLID_FROM; }

function moveX(e, dx) {
  e.x += dx;
  const top = Math.floor(e.y / TS), bot = Math.floor((e.y + e.h - .01) / TS);
  if (dx > 0) {
    const tx = Math.floor((e.x + e.w - .01) / TS);
    for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = tx * TS - e.w; return true; }
  } else if (dx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = (tx + 1) * TS; return true; }
  }
  return false;
}
function moveY(e, dy) {
  e.y += dy;
  const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - .01) / TS);
  if (dy > 0) {
    const ty = Math.floor((e.y + e.h - .01) / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; return null; }
  } else if (dy < 0) {
    const ty = Math.floor(e.y / TS);
    if (solid(l, ty) || solid(r, ty)) {
      const cx = Math.floor((e.x + e.w / 2) / TS);
      const hitX = solid(cx, ty) ? cx : solid(l, ty) ? l : r;
      e.y = (ty + 1) * TS; e.vy = 0;
      return { tx: hitX, ty };
    }
  }
  return null;
}

// ============================================================================
// Update
// ============================================================================
function update(dt) {
  jEdge = jQueue; jQueue = false;
  pEdge = pQueue; pQueue = false;
  if (koBanner && (koBanner.t -= dt) <= 0) koBanner = null;
  gameT += dt; stateT += dt;
  syncMusic();
  prevCamX = camX;
  if (p) { p.px = p.x; p.py = p.y; }
  if (guest) { guest.px = guest.x; guest.py = guest.y; }
  if (enemies) for (const e of enemies) { e.px = e.x; e.py = e.y; }
  if (toast && (toast.t -= dt) <= 0) toast = null;

  switch (state) {
    case 'title': if (jEdge) newGame(); return;
    case 'over': case 'clear': if (jEdge && stateT > .8) newGame(); updateParts(dt); return;
    case 'paused': if (jEdge) togglePause(); return;
    case 'porting':
      updateParts(dt);
      if (stateT > 4) warpFailed('NO ANSWER FROM ' + NET.hostName);
      return;
    case 'remote':
      netSendInputs(dt); updateGhost(dt); updateParts(dt);
      if (NET.recallT > 0 && (NET.recallT -= dt) <= 0) comeHome(null, 'BACK HOME');   // other screen never answered
      return;
    case 'dying':
      updatePlayer(dt); updateParts(dt);
      if (stateT > 2.6) {
        lives--;
        if (lives <= 0) { saveHi(); setState('over'); sfx.over(); }
        else { startLevel(); setState('play'); }
      }
      return;
  }
  if (state === 'play') {
    time -= dt;
    if (time <= 0) { time = 0; killPlayer(false); }
  }
  updatePlayer(dt);
  if (state === 'play' || state === 'flag') { updateGuest(dt); updateFight(); updateEnemies(dt); }
  updateParts(dt);
  for (const b of bumps) b.t += dt;
  if (bumps.length && bumps.some(b => b.t >= .2)) {
    for (const b of bumps) if (b.t >= .2) drawTileInto(tileLayerCtx, b.tx, b.ty);
    bumps = bumps.filter(b => b.t < .2);
  }
  followCam(p.x + p.w / 2, dt);
}
function followCam(x, dt) {
  camX += (x - VW * .42 - camX) * Math.min(1, dt * 10);
  camX = clamp(camX, 0, LW * TS - VW);
}

function updatePlayer(dt) {
  if (p.koT > 0) {                                          // knocked out: fly back, then drop back in
    p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL * 1.5); p.x += p.vx * dt; p.y += p.vy * dt;
    if ((p.koT -= dt) <= 0) recoverHost();
    return;
  }
  if (p.dead) {
    if (stateT > .5) { p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL * 1.5); p.y += p.vy * dt; }
    return;
  }
  if (state === 'flag') return flagUpdate(dt);
  if (p.warp) { stepWarp(p, dt); return; }

  const dir = (keys.ArrowRight ? 1 : 0) - (keys.ArrowLeft ? 1 : 0);
  p.jHeld = !!keys.KeyJ;
  if (keys.ArrowDown && state === 'play') { tryWarpDown(); if (p.warp) return; }
  if (pEdge) tryPunch(p);
  heroPhysics(p, dir, jEdge, dt);

  if (p.y > LH * TS + 8) killPlayer(true);
  if (p.x > CHECKPOINT_X * TS) checkpoint = true;
  if (p.x + p.w >= FLAGX * TS - 1 && state === 'play') startFlag();

  collectCoins(p);
}

// Movement + jumping for any hero (the local player or a visiting guest).
function heroPhysics(h, dir, jumpPressed, dt) {
  tickFight(h, dt);
  if (h.stun > 0) { dir = 0; jumpPressed = false; }          // reeling from a punch
  if (dir) {
    h.vx += dir * (h.vx * dir < 0 ? ACC * 2.4 : ACC) * dt;
    h.face = dir;
  } else {
    const d = (h.onGround ? DEC : AIR_DEC) * dt;
    h.vx = Math.abs(h.vx) <= d ? 0 : h.vx - Math.sign(h.vx) * d;
  }
  h.vx = clamp(h.vx, -MAX_VX, MAX_VX);

  // Jump: J on ground = jump; J again in the air = second jump (≈ double height)
  if (jumpPressed) h.buffer = .12;
  h.buffer -= dt; h.coyote -= dt;
  if (h.buffer > 0) {
    if (h.onGround || h.coyote > 0) {
      h.vy = -JUMP_V; h.jumps = 1; h.onGround = false; h.coyote = 0; h.buffer = 0; sfx.jump();
    } else if (jumpPressed && h.jumps < 2) {
      h.vy = -JUMP_V; h.jumps = 2; h.buffer = 0; h.spin = .4; puff(h); sfx.djump();
    }
  }

  h.vy = Math.min(h.vy + GRAV * dt, MAX_FALL);
  const wasGround = h.onGround;
  if (moveX(h, h.vx * dt)) h.vx = 0;
  h.onGround = false;
  const hit = moveY(h, h.vy * dt);
  if (hit) bump(hit.tx, hit.ty);
  if (h.onGround) h.jumps = 0;
  else if (wasGround && h.vy >= 0) { h.coyote = .1; h.jumps = 1; }

  h.anim += Math.abs(h.vx) * dt;
  if (h.spin > 0) h.spin -= dt;
}
function collectCoins(h) {
  for (const c of coins) if (!c.got && overlap(h, c)) {
    c.got = true; addCoin(); addScore(100); sfx.coin(); sparkle(c.x + 5, c.y + 7);
  }
}
// ---- warp pipes: stand on a coloured pipe and press DOWN to warp to that player
function pipeUnder(h) {
  if (!h.onGround) return null;
  const feet = h.y + h.h, cx = h.x + h.w / 2;
  for (let i = 0; i < PIPES.length; i++) {
    const pp = PIPES[i];
    if (Math.abs(feet - pp.top * TS) < 1 && cx > pp.x * TS + 4 && cx < pp.x * TS + 28) return i;
  }
  return null;
}
function pipeOwners() {                                   // pipe index -> the online player it leads to
  const out = [];
  [...NET.peers.keys()].sort().slice(0, PIPES.length).forEach((id, i) =>
    out[i] = { id, name: NET.peers.get(id).name, color: PLAYER_COLORS[i % PLAYER_COLORS.length] });
  return out;
}
function colorOf(id) { const o = pipeOwners().find(o => o && o.id === id); return o ? o.color : '#e84ab0'; }
function startWarpIn(h, i, done) {
  const pp = PIPES[i];
  h.x = pp.x * TS + 16 - h.w / 2; h.vx = h.vy = 0; h.punchT = 0; h.spin = 0;
  h.warp = { mode: 'in', t: 0, top: pp.top * TS, done };
  sfx.pipe();
}
function emergeFrom(h, i) {
  const pp = PIPES[i];
  h.x = pp.x * TS + 16 - h.w / 2; h.y = pp.top * TS; h.px = h.x; h.py = h.y; h.vx = h.vy = 0;
  h.warp = { mode: 'out', t: 0, top: pp.top * TS }; h.visible = true; h.dead = false;
  sfx.pipe();
}
function stepWarp(h, dt) {
  const w = h.warp, k = Math.min(1, (w.t += dt) / WARP_TIME);
  h.y = w.mode === 'in' ? w.top - h.h + h.h * k : w.top - h.h * k;
  if (k < 1) return;
  h.warp = null;
  if (w.mode === 'in') w.done(); else { h.onGround = true; h.inv = Math.max(h.inv || 0, .6); }
}
const toastOnce = msg => { if (!toast || toast.s !== msg) showToast(msg); };
function tryWarpDown() {
  const i = pipeUnder(p);
  if (i === null) return;
  if (NET.status !== 'online') return toastOnce(NET.status === 'offline' ? 'WARP PIPES OFFLINE' : 'WARP PIPES CONNECTING...');
  const o = pipeOwners()[i];
  if (!o) return toastOnce('NO PLAYER ON THIS PIPE');
  if (guest) return toastOnce("CAN'T WARP WHILE " + guest.name + ' VISITS');
  const pr = NET.peers.get(o.id);
  if (!pr || pr.g || pr.st === 'remote' || pr.st === 'porting') return toastOnce(o.name + ' IS BUSY');
  startWarpIn(p, i, () => enterPortal(i));
}
function heroes() {
  const hs = [];
  if (state === 'play' && !p.dead && !p.warp) hs.push(p);
  if (guest && !guest.dead && !guest.warp) hs.push(guest);
  return hs;
}
// Run fn with the global score/coins/lives swapped for the guest's, so the shared
// helpers (bump, addScore, addCoin) credit whoever actually did the thing.
function asGuest(g, fn) {
  const saved = [score, coinCount, lives];
  score = g.score; coinCount = g.coins; lives = g.lives;
  try { fn(); } finally { g.score = score; g.coins = coinCount; g.lives = lives; [score, coinCount, lives] = saved; }
}
const credit = (h, fn) => h === p ? fn() : asGuest(h, fn);

function killPlayer(fell) {
  if (p.dead) return;
  p.dead = true; p.vx = 0; p.vy = fell ? 0 : -430; p.spin = 0;
  setState('dying'); sfx.die();
}

function bump(tx, ty) {
  const t = getT(tx, ty);
  if (t === QBLOCK) {
    changeTile(tx, ty, USED);
    startBump(tx, ty);
    parts.push({ type: 'coin', x: tx * TS, y: ty * TS - 16, vy: -330, g: 1100, life: .5 });
    addCoin(); addScore(200, tx * TS + 2, ty * TS - 20); sfx.coin();
    hitEnemiesAbove(tx, ty);
  } else if (t === BRICK) {
    changeTile(tx, ty, 0);
    for (const [ox, oy, vx, vy] of [[0, 0, -70, -330], [8, 0, 70, -330], [0, 8, -60, -220], [8, 8, 60, -220]])
      parts.push({ type: 'debris', x: tx * TS + ox, y: ty * TS + oy, vx, vy, g: 1300, life: 1.2, sx: ox, sy: oy });
    addScore(50); sfx.brk(); shake = .12;
    hitEnemiesAbove(tx, ty);
  } else {
    if ((t === USED || t === CRATE) && !bumps.some(b => b.tx === tx && b.ty === ty)) startBump(tx, ty);
    sfx.bump();
  }
}
function hitEnemiesAbove(tx, ty) {
  for (const e of enemies) {
    if (e.dead || !e.active) continue;
    if (Math.abs(e.y + e.h - ty * TS) < 4 && e.x + e.w > tx * TS && e.x < tx * TS + TS) {
      e.dead = true; e.flipped = true; e.vy = -280; e.vx = e.x + e.w / 2 > tx * TS + 8 ? 60 : -60;
      addScore(100, e.x, e.y - 8); sfx.stomp();
    }
  }
}

function updateEnemies(dt) {
  for (const e of enemies) {
    if (!e.active) { if (e.x < camX + VW + 24) e.active = true; else continue; }
    if (e.squash > 0) { e.squash -= dt; continue; }
    if (e.flipped) { e.vy += GRAV * dt; e.y += e.vy * dt; e.x += e.vx * dt; continue; }
    e.vy = Math.min(e.vy + GRAV * dt, MAX_FALL);
    if (moveX(e, e.vx * dt)) e.vx = -e.vx;
    e.onGround = false;
    moveY(e, e.vy * dt);
    e.anim += dt;
    if (e.y > LH * TS + 16) e.dead = true;
    for (const h of heroes()) {
      if (e.dead || !overlap(h, e)) continue;
      if (h.vy > 0 && h.py + h.h <= e.py + 6) {
        e.dead = true; e.squash = .45;
        h.vy = h.jHeld ? -JUMP_V : -STOMP_V; h.jumps = 1;
        credit(h, () => addScore(100, e.x, e.y - 10)); sfx.stomp();
      } else if (h.inv > 0) continue;
      else if (h === p) killPlayer(false);
      else guestDie(false);
    }
  }
  // enemies bounce off each other
  for (let i = 0; i < enemies.length; i++) {
    const a = enemies[i]; if (!a.active || a.dead) continue;
    for (let j = i + 1; j < enemies.length; j++) {
      const b = enemies[j]; if (!b.active || b.dead) continue;
      if (overlap(a, b)) { const s = Math.abs(a.vx); if (a.x < b.x) { a.vx = -s; b.vx = s; } else { a.vx = s; b.vx = -s; } }
    }
  }
  enemies = enemies.filter(e => !(e.dead && e.squash <= 0 && (!e.flipped || e.y > LH * TS + 32)));
}

function startFlag() {
  setState('flag');
  const h = 12 * TS - (p.y + p.h);
  const pts = h > 120 ? 5000 : h > 90 ? 2000 : h > 60 ? 800 : h > 30 ? 400 : 100;
  addScore(pts, FLAGX * TS + 12, p.y);
  p.vx = 0; p.vy = 0; p.spin = 0; p.phase = 0; p.face = 1;
  p.x = FLAGX * TS + 8 - p.w; p.px = p.x;
  sfx.flag();
}
function flagUpdate(dt) {
  if (p.phase === 0) {                                           // slide down
    p.y = Math.min(p.y + 160 * dt, 12 * TS - p.h);
    flagY = Math.min(flagY + 160 * dt, 11 * TS);
    if (p.y >= 12 * TS - p.h && flagY >= 11 * TS) { p.phase = 1; stateT = 0; p.x += 10; p.px = p.x; p.face = -1; }
  } else if (p.phase === 1) {                                    // pause on the other side
    if (stateT > .4) { p.phase = 2; p.face = 1; }
  } else if (p.phase === 2) {                                    // walk into castle
    p.vx = 72; p.vy = Math.min(p.vy + GRAV * dt, MAX_FALL);
    moveX(p, p.vx * dt); p.onGround = false; moveY(p, p.vy * dt);
    p.anim += p.vx * dt;
    if (p.x >= (CASTLE_X + 2) * TS + 2) { p.visible = false; p.phase = 3; stateT = 0; sfx.clear(); }
  } else if (p.phase === 3) {                                    // time bonus
    if (stateT > 1.2 && time > 0) {
      const d = Math.min(Math.ceil(time), 2); time = Math.max(0, Math.ceil(time) - d); score += d * 50;
      if (Math.floor(gameT * 30) % 2 === 0) sfx.tick();
    } else if (time <= 0 && stateT > 1.2) { saveHi(); setState('clear'); }
  }
}
function saveHi() { if (score > hiScore) { hiScore = score; try { localStorage.setItem('jumpgame.hi', hiScore); } catch (e) {} } }

// ---------------------------------------------------------------- particles
let shake = 0;
function puff(h) {
  for (let i = 0; i < 10; i++) {
    const a = Math.PI * 2 * i / 10;
    parts.push({ type: 'puff', x: h.x + h.w / 2, y: h.y + h.h, vx: Math.cos(a) * 90, vy: Math.sin(a) * 30 + 10, life: .35, max: .35 });
  }
}
function sparkle(x, y, col = '#fff6b0', n = 6, speed = 70, life = .3) {
  for (let i = 0; i < n; i++) {
    const a = Math.PI * 2 * i / n;
    parts.push({ type: 'spark', x, y, vx: Math.cos(a) * speed, vy: Math.sin(a) * speed, life, max: life, col });
  }
}
const portalBurst = (x, y) => { sparkle(x, y, '#c49aff', 16, 110, .6); sparkle(x, y, '#ffffff', 8, 60, .5); };
function updateParts(dt) {
  for (const q of parts) {
    q.life -= dt;
    if (q.g) q.vy += q.g * dt;
    q.x += (q.vx || 0) * dt; q.y += (q.vy || 0) * dt;
  }
  if (parts.length) parts = parts.filter(q => q.life > 0);
  if (shake > 0) shake -= dt;
}

// ============================================================================
// Render (interpolated between physics steps for perfectly smooth motion)
// ============================================================================
let skyGrad;
function resize() {
  const w = innerWidth, h = innerHeight;
  VW = clamp(Math.round(VH * w / h), 256, 480);
  cvs.width = VW; cvs.height = VH;
  const s = Math.min(w / VW, h / VH);
  // snap to integer scale when it nearly fits -> crisper pixels
  const si = Math.floor(s);
  const scale = si >= 2 && s - si < .15 ? si : s;
  cvs.style.width = VW * scale + 'px'; cvs.style.height = VH * scale + 'px';
  ctx.imageSmoothingEnabled = false;
  skyGrad = ctx.createLinearGradient(0, 0, 0, VH);
  skyGrad.addColorStop(0, '#4a86f4'); skyGrad.addColorStop(.7, '#8cc0ff'); skyGrad.addColorStop(1, '#b8dcff');
  if (p) camX = prevCamX = clamp(camX, 0, LW * TS - VW);
}
addEventListener('resize', resize);

const lerp = (a, b, t) => a + (b - a) * t;
let camF = 0;
// snap a world coordinate to the screen pixel grid relative to the interpolated camera (no 1px jitter)
const snapX = wx => Math.round(wx - camF) + Math.round(camF);

function render(alpha) {
  camF = lerp(prevCamX, camX, alpha);
  const cx = Math.round(camF);
  let sy = 0;
  if (shake > 0) sy = Math.round((Math.random() - .5) * 3);

  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, VW, VH);

  // far hills (parallax .25)
  const fo = Math.round(cx * .25) % 320;
  for (let x = -fo; x < VW; x += 320) ctx.drawImage(FAR_HILLS, x, 13 * TS - 72 + sy);
  // clouds (parallax .5)
  const co = Math.round(cx * .5);
  for (const c of clouds) { const x = c.x - co; if (x > -60 && x < VW) ctx.drawImage(CLOUD, x, c.y); }

  ctx.save();
  ctx.translate(-cx, sy);
  // near scenery
  for (const d of decos) if (d.x + d.img.width > cx && d.x < cx + VW) ctx.drawImage(d.img, d.x, d.y);
  ctx.drawImage(CASTLE, CASTLE_X * TS, 13 * TS - 96);
  // flag pole
  const poleX = FLAGX * TS + 7;
  ctx.fillStyle = '#4a7a3a'; ctx.fillRect(poleX, 2 * TS + 6, 2, 10 * TS - 6);
  ctx.fillStyle = '#9ce07a'; ctx.fillRect(poleX, 2 * TS + 6, 1, 10 * TS - 6);
  ctx.drawImage(COIN[0], poleX - 7, 2 * TS - 6);
  ctx.drawImage(FLAG, poleX - 16, Math.round(flagY));

  // tiles: cached static layer (only visible slice is blitted)
  const sx0 = Math.max(0, cx), sw = Math.min(VW, LW * TS - sx0);
  ctx.drawImage(tileLayer, sx0, 0, sw, VH, sx0, 0, sw, VH);
  // warp pipes: recolour each pipe that leads to an online player and label it with their name
  const owners = pipeOwners(), onPipe = state === 'play' && p && !p.warp ? pipeUnder(p) : null;
  PIPES.forEach((pp, i) => {
    const o = owners[i];
    if (!o || pp.x * TS + 32 < cx || pp.x * TS > cx + VW) return;
    const spr = pipeFor(o.color);
    ctx.drawImage(spr.lip, pp.x * TS, pp.top * TS);
    for (let y = pp.top + 1; y <= 12; y++) ctx.drawImage(spr.body, pp.x * TS, y * TS);
    drawText(o.name, pp.x * TS + 16, pp.top * TS - 12, o.color, 'center');
    if (onPipe === i && Math.floor(gameT * 3) % 2 === 0) drawText('PRESS DOWN', pp.x * TS + 16, pp.top * TS - 24, '#ffffff', 'center');
  });
  // animated / bumped tiles
  const qf = TILE.q[[0, 0, 0, 1, 2, 1][Math.floor(gameT * 7) % 6]];
  const tx0 = Math.floor(cx / TS), tx1 = Math.min(LW - 1, tx0 + Math.ceil(VW / TS) + 1);
  for (let y = 0; y < LH; y++) for (let x = tx0; x <= tx1; x++) if (grid[y][x] === QBLOCK) ctx.drawImage(qf, x * TS, y * TS);
  for (const b of bumps) {
    const off = Math.round(Math.sin(Math.min(1, b.t / .2) * Math.PI) * 5);
    const t = grid[b.ty][b.tx];
    const img = t === QBLOCK ? qf : tileImage(t, b.tx, b.ty);
    if (img) ctx.drawImage(img, b.tx * TS, b.ty * TS - off);
  }

  // coins
  const cf = COIN[Math.floor(gameT * 8) % 4];
  for (const c of coins) if (!c.got && c.x > cx - 16 && c.x < cx + VW) ctx.drawImage(cf, c.x - 3, c.y - 1);

  // enemies
  for (const e of enemies) {
    if (!e.active) continue;
    const ex = snapX(lerp(e.px, e.x, alpha)) - 1, ey = Math.round(lerp(e.py, e.y, alpha)) - 2;
    if (ex < cx - 20 || ex > cx + VW + 4) continue;
    const img = ENEMY[Math.floor(e.anim * 6) % 2];
    if (e.squash > 0) ctx.drawImage(ENEMY[0], ex, ey + 9, 16, 7);
    else if (e.flipped) { ctx.save(); ctx.translate(ex, ey + 16); ctx.scale(1, -1); ctx.drawImage(img, 0, 0); ctx.restore(); }
    else ctx.drawImage(img, ex, ey);
  }

  drawPlayer(alpha);

  // particles
  for (const q of parts) {
    const x = Math.round(q.x), y = Math.round(q.y);
    if (q.type === 'text') drawText(q.s, x, y, '#fff', 'left');
    else if (q.type === 'coin') ctx.drawImage(COIN[Math.floor(gameT * 16) % 4], x, y);
    else if (q.type === 'debris') ctx.drawImage(TILE.brick, q.sx, q.sy, 8, 8, x, y, 8, 8);
    else if (q.type === 'puff') { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 3, 3); ctx.globalAlpha = 1; }
    else if (q.type === 'spark') { ctx.globalAlpha = q.life / q.max; ctx.fillStyle = q.col; ctx.fillRect(x, y, 2, 2); ctx.globalAlpha = 1; }
  }
  ctx.restore();

  drawHUD();
  drawOverlay();
}

function drawPlayer(alpha) {
  if (p && p.visible && state !== 'porting' && state !== 'remote') drawHero(p, HERO, alpha);
  if (state === 'remote' && NET.ghost) {
    ctx.globalAlpha = .45 + Math.sin(gameT * 6) * .1; drawHero(NET.ghost, HERO, alpha); ctx.globalAlpha = 1;
  }
  if (guest) {
    const col = colorOf(guest.id);
    drawHero(guest, heroFor(col), alpha);
    const gx = snapX(lerp(guest.px, guest.x, alpha)) + 6, gy = Math.round(lerp(guest.py, guest.y, alpha));
    if (!guest.warp) drawText(guest.name, gx, gy - 11, col, 'center');
  }
  for (const h of [state === 'remote' || state === 'porting' ? null : p, guest, state === 'remote' ? NET.ghost : null]) {   // hit pips above anyone who's been punched
    if (!h || !h.hits || h.dead) continue;
    const hx = snapX(lerp(h.px, h.x, alpha)) + 6 - 9, hy = Math.round(lerp(h.py, h.y, alpha)) - (h === guest ? 20 : 8);
    drawPips(hx, hy, h.hits);
  }
}
function drawPips(x, y, n) {
  for (let i = 0; i < KO_HITS; i++) {
    ctx.fillStyle = '#1a1020'; ctx.fillRect(x + i * 7, y, 6, 5);
    ctx.fillStyle = i < n ? '#ff3a3a' : '#ffffff'; ctx.fillRect(x + i * 7 + 1, y + 1, 4, 3);
  }
}
function drawHero(h, set, alpha) {
  if (!h.warp) return drawHeroSprite(h, set, alpha);
  ctx.save();                                              // only the part above the pipe's rim shows
  ctx.beginPath(); ctx.rect(-1e4, -1e4, 2e4, 1e4 + h.warp.top); ctx.clip();
  drawHeroSprite(h, set, alpha);
  ctx.restore();
}
function drawHeroSprite(h, set, alpha) {
  const flagPose = h === p && state === 'flag';
  let spr;
  if (h.inv > 0 && !h.dead && Math.floor(gameT * 20) % 2) return;     // flash while invulnerable
  if (h.punchT > 0 && !h.dead) spr = set.punch;
  else if (h.dead || !h.onGround && !flagPose) spr = set.jump;
  else if (flagPose && h.phase < 2) spr = set.idle;
  else if (h.punchT > 0) spr = set.punch;
  else if (Math.abs(h.vx) > 5) spr = Math.floor(h.anim / 7) % 2 ? set.walk2 : set.walk1;
  else spr = set.idle;
  const img = h.face < 0 ? spr.l : spr.r;
  const x = snapX(lerp(h.px, h.x, alpha)) - 2, y = Math.round(lerp(h.py, h.y, alpha));
  if (h.spin > 0) {
    ctx.save(); ctx.translate(x + 8, y + 8);
    ctx.rotate((1 - h.spin / .4) * Math.PI * 2 * h.face);
    ctx.drawImage(img, -8, -8); ctx.restore();
  } else ctx.drawImage(img, x, y);
}

const FONT = '"Press Start 2P", monospace';
function drawText(s, x, y, col = '#fff', align = 'left', size = 8) {
  ctx.font = size + 'px ' + FONT; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.fillStyle = '#1a1020'; ctx.fillText(s, x + 1, y + 1);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const pad = (n, l) => String(Math.max(0, Math.floor(n))).padStart(l, '0');
function drawHUD() {
  if (state === 'title') return;
  const c2 = Math.round(VW * .36), c3 = Math.round(VW * .6);
  drawText('SCORE', 8, 8); drawText(pad(score, 6), 8, 18);
  drawText('COINS', c2, 8);
  ctx.drawImage(COIN[0], c2 - 3, 15, 12, 12); drawText('x' + pad(coinCount, 2), c2 + 10, 18);
  drawText('TIME', c3, 8); drawText(pad(Math.ceil(time), 3), c3, 18, time < 60 && state === 'play' && Math.floor(gameT * 4) % 2 ? '#ff6050' : '#fff');
  drawText('LIVES', VW - 8, 8, '#fff', 'right'); drawText('x' + lives, VW - 8, 18, '#fff', 'right');
  if (NET.status === 'online' && NET.peers.size) drawText('ONLINE ' + (NET.peers.size + 1), 8, VH - 14, '#e0c8ff');
  if (state === 'play' || state === 'paused') {                // pause / resume button
    const { x, y, w, h } = PAUSE_BTN;
    ctx.fillStyle = 'rgba(20,10,40,.45)'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#fff';
    if (state === 'play') { ctx.fillRect(x + 5, y + 4, 3, 10); ctx.fillRect(x + 10, y + 4, 3, 10); }
    else for (let i = 0; i < 5; i++) ctx.fillRect(x + 6 + i, y + 4 + i, 1, 10 - i * 2);   // play triangle
  }
}
function drawSoundButtons() {
  const btn = (b, on, icon) => {
    ctx.fillStyle = 'rgba(20,10,40,.45)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = '#fff'; icon(b.x, b.y);
    if (!on) { ctx.fillStyle = '#ff3a3a'; for (let i = 0; i < 14; i++) ctx.fillRect(b.x + 2 + i, b.y + 2 + i, 2, 2); }

// ============================================================================
// Warp pipes. Everyone playing joins one lobby on a public MQTT relay (or a private
// one with ?room=). Each other player online gets a coloured warp pipe; going DOWN it
// hands your hero to that player's screen, and your own device turns into its
// controller (showing a ghost of your hero) until you press X or run out of lives.
// ============================================================================
const BROKER = 'wss://broker.emqx.io:8084/mqtt';
const MQTT_LIB = 'https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js';
const NAME_A = ['RED', 'BLUE', 'GOLD', 'MINT', 'PINK', 'JADE', 'RUBY', 'SKY'];
const NAME_B = ['FOX', 'OWL', 'CAT', 'FROG', 'BEAR', 'WOLF', 'BEE', 'YAK'];
const NET = { id: Math.random().toString(36).slice(2, 10), name: '', base: '', client: null, status: 'connecting',
  peers: new Map(), links: new Map(), host: null, hostName: '', pipe: 0, seq: 0, pseq: 0, lastSent: '', sendT: 0 };
let guest = null, toast = null;
const cleanName = n => String(n || '').toUpperCase().replace(/[^A-Z0-9 ]/g, '').trim().slice(0, 10) || 'PLAYER';
const clampInt = (v, a, b) => clamp(Math.floor(+v || 0), a, b);
try { NET.name = localStorage.getItem('jumpgame.name') || ''; } catch (e) {}
if (!NET.name) NET.name = NAME_A[Math.random() * 8 | 0] + ' ' + NAME_B[Math.random() * 8 | 0];

function showToast(msg, t = 2.5) { toast = { s: msg, t }; }
function renamePlayer() {
  const n = prompt('Your player name (shown on other screens):', NET.name);
  for (const k in keys) keys[k] = false;
  if (!n) return;
  NET.name = cleanName(n);
  try { localStorage.setItem('jumpgame.name', NET.name); } catch (e) {}
  announce();
}

function netRoom() {
  const q = new URLSearchParams(location.search).get('room');
  return q ? 'r-' + q.toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 32) : 'global';
}
function loadScript(src) {
  return new Promise((res, rej) => {
    const el = document.createElement('script');
    el.src = src; el.async = true; el.onload = res; el.onerror = rej;
    document.head.appendChild(el);
  });
}
async function netInit() {
  try {
    const room = netRoom();
    await loadScript(MQTT_LIB);
    NET.base = 'jumpgame/v1/' + room;
    const c = NET.client = mqtt.connect(BROKER, { clientId: 'jg_' + NET.id, clean: true, reconnectPeriod: 3000, connectTimeout: 8000 });
    c.on('connect', () => { NET.status = 'online'; c.subscribe([NET.base + '/presence', NET.base + '/to/' + NET.id]); announce(); });
    c.on('offline', () => { NET.status = 'connecting'; });
    c.on('message', (topic, buf) => {
      let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
      if (m && typeof m === 'object' && typeof m.from === 'string' && m.from !== NET.id) onNet(topic, m);
    });
    setInterval(announce, 2000);
  } catch (e) { NET.status = 'offline'; }
}
function netPub(topic, m) { if (NET.client && NET.status === 'online') NET.client.publish(topic, JSON.stringify({ ...m, from: NET.id })); }
function sendTo(id, m) { if (id) netPub(NET.base + '/to/' + id, m); }
// Frequent, self-healing messages (inputs, pose) go over the direct link when it's open.
function sendFast(id, m) {
  const l = NET.links.get(id);
  if (l && l.dc && l.dc.readyState === 'open') { try { l.dc.send(JSON.stringify(m)); return; } catch (e) {} }
  sendTo(id, m);
}
const fastLink = id => { const l = NET.links.get(id); return !!(l && l.dc && l.dc.readyState === 'open'); };

// ---- direct peer-to-peer link (WebRTC data channel). The public relay is too slow for
// real-time play (~0.5-1s), so once a hero ports, the two devices connect directly and
// stream inputs/poses with ~tens of ms latency; the relay remains the fallback.
const RTC_CFG = { iceServers: [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] }] };
function closeLink(id) { const l = NET.links.get(id); if (l) { try { l.pc.close(); } catch (e) {} NET.links.delete(id); } }
function iceGathered(pc) {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const t = setTimeout(res, 2500);
    pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
  });
}
function wireChannel(id, dc) {
  dc.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch (err) { return; }
    if (m && typeof m === 'object' && (m.t === 'in' || m.t === 'gstate')) { m.from = id; onNet('direct', m); }
  };
}
async function openLink(id) {                       // the player who went down the warp pipe
  if (!window.RTCPeerConnection) return;
  try {
    closeLink(id);
    const pc = new RTCPeerConnection(RTC_CFG), dc = pc.createDataChannel('game', { ordered: false, maxRetransmits: 0 });
    NET.links.set(id, { pc, dc }); wireChannel(id, dc);
    await pc.setLocalDescription(await pc.createOffer()); await iceGathered(pc);
    sendTo(id, { t: 'rtc-offer', sdp: pc.localDescription.sdp });
  } catch (e) { closeLink(id); }
}
async function acceptLink(id, sdp) {                // the screen the hero arrived on
  if (!window.RTCPeerConnection || typeof sdp !== 'string' || sdp.length > 20000) return;
  try {
    closeLink(id);
    const pc = new RTCPeerConnection(RTC_CFG), l = { pc, dc: null }; NET.links.set(id, l);
    pc.ondatachannel = e => { l.dc = e.channel; wireChannel(id, e.channel); };
    await pc.setRemoteDescription({ type: 'offer', sdp });
    await pc.setLocalDescription(await pc.createAnswer()); await iceGathered(pc);
    sendTo(id, { t: 'rtc-answer', sdp: pc.localDescription.sdp });
  } catch (e) { closeLink(id); }
}
function finishLink(id, sdp) {
  const l = NET.links.get(id);
  if (l && typeof sdp === 'string' && sdp.length < 20000 && !l.pc.remoteDescription) l.pc.setRemoteDescription({ type: 'answer', sdp }).catch(() => closeLink(id));
}
function announce() {
  netPub(NET.base + '/presence', { t: 'here', name: NET.name, st: state, g: guest ? 1 : 0 });
  prunePeers();
}
function prunePeers() {
  const now = performance.now();
  for (const [id, pr] of NET.peers) {
    if (now - pr.seen < 6500) continue;
    NET.peers.delete(id);
    if (guest && guest.id === id) { showToast(guest.name + ' LEFT'); guest = null; }
    closeLink(id);
    if ((state === 'remote' || state === 'porting') && NET.host === id) comeHome(null, 'LOST ' + NET.hostName);
  }
}
function onNet(topic, m) {
  if (topic.endsWith('/presence')) {
    if (m.t === 'bye') { const pr = NET.peers.get(m.from); if (pr) { pr.seen = -1e9; prunePeers(); } return; }
    NET.peers.set(m.from, { name: cleanName(m.name), st: String(m.st), g: !!m.g, seen: performance.now() });
    return;
  }
  const fromHost = m.from === NET.host && (state === 'remote' || state === 'porting');
  const fromGuest = guest && guest.id === m.from;
  switch (m.t) {
    case 'port': receivePort(m); break;
    case 'accept': if (fromHost && state === 'porting') { setState('remote'); NET.hostName = cleanName(m.name); sfx.djump(); openLink(m.from); } break;
    case 'rtc-offer': if (fromGuest) acceptLink(m.from, m.sdp); break;
    case 'rtc-answer': if (fromHost) finishLink(m.from, m.sdp); break;
    case 'busy': if (fromHost) warpFailed(NET.hostName + ' IS BUSY'); break;
    case 'gstate': if (fromHost) { applyStats(m); ghostTarget(m); } break;
    case 'home': if (fromHost) comeHome(m, m.reason === 'out' ? 'OUT OF LIVES!' : 'WELCOME HOME!'); break;
    case 'in':
      if (!fromGuest) break;
      guest.keys.l = !!m.l; guest.keys.r = !!m.r; guest.keys.j = !!m.j; guest.keys.d = !!m.d; guest.seen = performance.now();
      if (+m.jp > guest.jp) { guest.jp = +m.jp; guest.jQueue = true; }
      if (+m.pp > guest.pp) { guest.pp = +m.pp; guest.pQueue = true; }
      break;
    case 'ko':
      if (!fromHost) break;
      koBanner = { t: 2, s: 'K.O.!' };
      showToast(m.won ? 'YOU KNOCKED OUT ' + NET.hostName + '!' : 'KNOCKED OUT BY ' + NET.hostName, 3);
      sfx.ko();
      break;
    case 'recall': if (fromGuest) { sparkle(guest.x + 6, guest.y + 8, colorOf(guest.id), 14, 100, .5); sendGuestHome('recall'); } break;
    case 'leave': if (fromGuest) { showToast(guest.name + ' WENT HOME'); closeLink(guest.id); guest = null; } break;
  }
}
function applyStats(m) { score = clampInt(m.score, 0, 9999999); coinCount = clampInt(m.coins, 0, 99); lives = clampInt(m.lives, 0, 99); }

// ---- this device went down a warp pipe: hand the hero to that pipe's player
function enterPortal(i) {
  const o = pipeOwners()[i];
  if (!o) { emergeFrom(p, i); return; }
  NET.host = o.id; NET.hostName = o.name; NET.pipe = i; NET.lastSent = '';
  sendTo(o.id, { t: 'port', name: NET.name, score, coins: coinCount, lives });
  setState('porting');
}
// X: bring my hero back home from the other screen
function recallHome() {
  if (state === 'porting') { sendTo(NET.host, { t: 'leave' }); warpFailed('WARP CANCELLED'); return; }
  if (state !== 'remote' || NET.recallT > 0) return;
  sendTo(NET.host, { t: 'recall' });
  NET.recallT = 3;
  showToast('COMING HOME...');
}
function warpFailed(msg) { NET.host = null; setState('play'); emergeFrom(p, NET.pipe); showToast(msg); }
// ---- ghost: while my hero is on another screen, mirror it (see-through) in my own level
function ghostTarget(m) {
  if (state !== 'remote') return;
  const x = clamp(+m.x || 0, 0, LW * TS), y = clamp(+m.y || 0, -64, LH * TS + 64);
  let g = NET.ghost;
  if (!g) g = NET.ghost = { x, y, px: x, py: y, w: 12, h: 16, vx: 0, face: 1, anim: 0, onGround: true, spin: 0, dead: false,
                            punchT: 0, inv: 0, hits: 0, stun: 0, tx: x, ty: y };
  g.tx = x; g.ty = y; g.vx = +m.vx || 0; g.face = m.f < 0 ? -1 : 1; g.onGround = !!m.og;
  g.punchT = m.pt ? .1 : 0; g.dead = !!m.d; g.hits = clampInt(m.h, 0, KO_HITS);
  if (m.sp && g.spin <= 0) g.spin = .4;
}
function updateGhost(dt) {
  const g = NET.ghost;
  if (!g) return;
  g.px = g.x; g.py = g.y;
  const k = Math.min(1, dt * 14);
  if (Math.abs(g.tx - g.x) > 96 || Math.abs(g.ty - g.y) > 96) { g.x = g.tx; g.y = g.ty; g.px = g.x; g.py = g.y; }   // teleport (respawn)
  else { g.x += (g.tx - g.x) * k; g.y += (g.ty - g.y) * k; }
  g.anim += Math.abs(g.vx) * dt;
  if (g.spin > 0) g.spin -= dt;
  followCam(g.x + g.w / 2, dt);
}
function netSendInputs(dt) {
  const l = !!keys.ArrowLeft, r = !!keys.ArrowRight, j = !!keys.KeyJ, d = !!keys.ArrowDown;
  if (jEdge) NET.seq++;
  if (pEdge) NET.pseq++;
  const sig = '' + l + r + j + d + NET.seq + ',' + NET.pseq;
  NET.sendT -= dt;
  if (sig !== NET.lastSent || NET.sendT <= 0) {           // send on change + a steady keep-alive
    sendFast(NET.host, { t: 'in', l, r, j, d, jp: NET.seq, pp: NET.pseq });
    NET.lastSent = sig; NET.sendT = fastLink(NET.host) ? .1 : .3;
  }
}
function comeHome(m, msg) {
  if (m) applyStats(m);
  closeLink(NET.host); NET.host = null; NET.ghost = null; NET.recallT = 0;
  showToast(msg);
  if (lives <= 0) { saveHi(); setState('over'); sfx.over(); return; }
  setState('play');
  emergeFrom(p, clamp(NET.pipe, 0, PIPES.length - 1));     // pop back out of the pipe you left from
  camX = prevCamX = clamp(p.x - VW * .42, 0, LW * TS - VW);
}

// ---- another device's hero arrives on this screen
function receivePort(m) {
  if ((guest && guest.id !== m.from) || state === 'remote' || state === 'porting') { sendTo(m.from, { t: 'busy' }); return; }
  if (!['play', 'flag', 'paused', 'dying'].includes(state)) newGame();
  guest = { id: m.from, name: cleanName(m.name), score: clampInt(m.score, 0, 9999999), coins: clampInt(m.coins, 0, 99),
            lives: clampInt(m.lives, 1, 99), keys: { l: false, r: false, j: false, d: false }, jp: 0, jQueue: false, pp: 0, pQueue: false, sendT: 0 };
  spawnGuest();
  sendTo(m.from, { t: 'accept', name: NET.name });
  showToast(guest.name + ' WARPED IN!'); sfx.oneup();
}
function spawnGuest() {
  const g = guest;
  const tx = clamp(Math.floor((p.x + p.w / 2) / TS) + 2, Math.ceil(camX / TS) + 1, Math.floor((camX + VW) / TS) - 2);
  Object.assign(g, { x: tx * TS + 2, y: -20, w: 12, h: 16, vx: 0, vy: 0, onGround: false, face: -1, jumps: 2, coyote: 0,
                     buffer: 0, anim: 0, spin: .4, dead: false, deadT: 0, jHeld: false, warp: null, seen: performance.now(), ...FIGHT_FIELDS() });
  g.px = g.x; g.py = g.y;
  // rise out of a pipe on screen (their own colour if visible, else the one nearest the host); else drop in from the sky
  const onScreen = PIPES.map((pp, i) => ({ pp, i })).filter(({ pp }) => pp.x * TS >= camX && pp.x * TS + 32 <= camX + VW);
  if (onScreen.length) {
    const own = onScreen.find(({ i }) => (pipeOwners()[i] || {}).id === g.id);
    const near = onScreen.sort((a, b) => Math.abs(a.pp.x * TS - p.x) - Math.abs(b.pp.x * TS - p.x))[0];
    emergeFrom(g, (own || near).i);
  } else { g.spin = .4; portalBurst(g.x + 6, 10); }
}
function updateGuest(dt) {
  const g = guest;
  if (!g) return;
  if ((g.sendT -= dt) <= 0) {                               // stats + pose for the owner's ghost (also while KO'd)
    g.sendT = fastLink(g.id) ? .05 : .2;                     // 20/s direct, 5/s over the relay
    sendFast(g.id, { t: 'gstate', score: g.score, coins: g.coins, lives: g.lives,
      x: Math.round(g.x), y: Math.round(g.y), vx: Math.round(g.vx), f: g.face, og: g.onGround ? 1 : 0,
      pt: g.punchT > 0 ? 1 : 0, sp: g.spin > 0 ? 1 : 0, h: g.hits, d: g.dead ? 1 : 0 });
  }
  if (g.dead) {
    g.vy = Math.min(g.vy + GRAV * dt, MAX_FALL * 1.5); g.y += g.vy * dt; g.x += g.vx * dt;
    if ((g.deadT -= dt) <= 0) { if (g.lives > 0) spawnGuest(); else sendGuestHome('out'); }
    return;
  }
  if (g.warp) { stepWarp(g, dt); return; }
  if (performance.now() - g.seen > 1500) g.keys.l = g.keys.r = g.keys.j = g.keys.d = false;   // controller went quiet
  const dir = (g.keys.r ? 1 : 0) - (g.keys.l ? 1 : 0);
  const jump = g.jQueue; g.jQueue = false; g.jHeld = g.keys.j;
  if (g.pQueue) { g.pQueue = false; tryPunch(g); }
  asGuest(g, () => { heroPhysics(g, dir, jump, dt); collectCoins(g); });
  if (state === 'play') {                                   // keep the guest on the host's screen
    if (g.x < camX) { g.x = camX; g.vx = Math.max(0, g.vx); }
    else if (g.x > camX + VW - g.w) { g.x = camX + VW - g.w; g.vx = Math.min(0, g.vx); }
  }

}
function guestDie(fell) {
  const g = guest;
  if (!g || g.dead) return;
  g.dead = true; g.lives--; g.vx = 0; g.vy = fell ? 0 : -400; g.spin = 0; g.deadT = 1.6;
  sfx.bump();
}
// ---- fighting: P throws a punch; 3 clean hits (not while the target is still flashing) = K.O.
const PUNCH_TIME = .2, PUNCH_ACTIVE = .12, PUNCH_CD = .32, PUNCH_REACH = 14, KO_HITS = 3;
let koBanner = null;
function FIGHT_FIELDS() { return { punchT: 0, punchCD: 0, punchHit: false, hits: 0, hitDecay: 0, inv: 0, stun: 0, koT: 0 }; }
function tryPunch(h) {
  if (h.dead || h.punchCD > 0 || h.stun > 0) return;
  h.punchT = PUNCH_TIME; h.punchCD = PUNCH_CD; h.punchHit = false;
  sfx.swing();
}
function tickFight(h, dt) {
  if (h.punchT > 0) h.punchT -= dt;
  if (h.punchCD > 0) h.punchCD -= dt;
  if (h.inv > 0) h.inv -= dt;
  if (h.stun > 0) h.stun -= dt;
  if (h.hits > 0 && (h.hitDecay -= dt) <= 0) h.hits = 0;     // a long pause between hits resets the count
}
function fistOf(h) { return { x: h.face > 0 ? h.x + h.w - 2 : h.x - PUNCH_REACH + 2, y: h.y + 3, w: PUNCH_REACH, h: 9 }; }
function updateFight() {
  const fighters = heroes();
  for (const a of fighters) {
    if (a.punchT <= PUNCH_TIME - PUNCH_ACTIVE || a.punchHit) continue;
    const fist = fistOf(a);
    for (const t of fighters) {
      if (t === a || t.dead || t.inv > 0 || !overlap(fist, t)) continue;
      a.punchHit = true; landPunch(a, t); break;
    }
    if (a.punchHit) continue;
    for (const e of enemies) {                                  // punches also flatten enemies
      if (!e.active || e.dead || !overlap(fist, e)) continue;
      e.dead = true; e.flipped = true; e.vy = -260; e.vx = a.face * 90;
      credit(a, () => addScore(100, e.x, e.y - 8)); sfx.punch(); a.punchHit = true; break;
    }
  }
}
function landPunch(a, t) {
  t.hits++; t.hitDecay = 6; t.inv = .5; t.stun = .35;
  t.vx = a.face * 230; t.vy = -200; t.onGround = false; t.face = -a.face;
  credit(a, () => addScore(100, t.x, t.y - 12));
  sparkle(a.face > 0 ? t.x : t.x + t.w, t.y + 6, '#fff6b0', 8, 90, .3);
  shake = .15; sfx.punch();
  if (t.hits >= KO_HITS) knockOut(a, t);
}
function knockOut(a, t) {
  t.hits = 0;
  koBanner = { t: 2, s: 'K.O.!' };
  credit(a, () => addScore(1000, t.x, t.y - 22));
  sfx.ko(); shake = .3;
  if (t === p) {                                              // the host got knocked out by the guest
    lives--; p.dead = true; p.koT = 1.6; p.vx = a.face * 260; p.vy = -460; p.punchT = 0;
    if (guest) sendTo(guest.id, { t: 'ko', won: true });
  } else {                                                    // the guest got knocked out
    guestDie(false); t.vx = a.face * 260; t.vy = -460;
    sendTo(t.id, { t: 'ko', won: false });
  }
}
function recoverHost() {
  if (lives <= 0) { saveHi(); setState('over'); sfx.over(); return; }
  const x = clamp(camX + VW * .4, 16, LW * TS - 32);
  Object.assign(p, { x, y: -20, vx: 0, vy: 0, dead: false, jumps: 2, spin: .4, inv: 1.5, stun: 0, hits: 0 });
  p.px = p.x; p.py = p.y;
}

function sendGuestHome(reason) {
  const g = guest;
  sendTo(g.id, { t: 'home', reason, score: g.score, coins: g.coins, lives: g.lives });
  closeLink(g.id);
  showToast(g.name + (reason === 'out' ? ' IS OUT!' : ' WENT HOME'));
  guest = null;
}
addEventListener('pagehide', () => {
  if (guest) sendGuestHome('leave');
  if (state === 'remote' || state === 'porting') sendTo(NET.host, { t: 'leave' });
  netPub(NET.base + '/presence', { t: 'bye' });
});

// ============================================================================
// Main loop: fixed timestep + accumulator + interpolation
// ============================================================================
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(.1, (now - last) / 1000);   // clamp to avoid spiral of death after tab switch
  last = now;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  const alpha = state === 'paused' ? 1 : acc / STEP;
  render(alpha);
  requestAnimationFrame(frame);
}

resize();
startLevel();
setState('title');
const fontReady = document.fonts ? Promise.race([document.fonts.load('8px "Press Start 2P"'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve();
fontReady.finally(() => { last = performance.now(); requestAnimationFrame(frame); });
cvs.focus();
netInit();
</script>
